[project]
name = "factory-ai-investigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.143.2",
    "firebase-admin>=7.7.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-run>=0.16.2",
    "google-cloud-storage>=3.17.0",
    "google-cloud-tasks>=2.26.0",
    "google-genai>=2.30.1",
    "jsonpatch>=1.33",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "qdrant-client>=1.19.1",
    "scikit-learn",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
factory-ai-investigator = "factory_ai_investigator:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
